# Private DNS for authenticated VPN peers. No query logging or DHCP.
listen-address=10.77.0.1
bind-interfaces
no-hosts
no-resolv
server=127.0.0.53
address=/monitor.papyrus-reader.com/10.77.0.1
local=/monitor.papyrus-reader.com/
cache-size=150
user=nobody
group=nogroup
pid-file=/run/papyrus-vpn-dns/dnsmasq.pid
log-facility=-
