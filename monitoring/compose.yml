name: papyrus-observability

x-service: &service
  restart: unless-stopped
  cpus: 0.25
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: '3'

services:
  grafana:
    <<: *service
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    mem_limit: 384m
    environment:
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:?Set GRAFANA_DOMAIN}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_SECRET_KEY__FILE: /run/secrets/grafana_secret_key
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_METRICS_ENABLED: 'true'
      GF_SMTP_ENABLED: 'true'
      GF_SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      GF_SMTP_USER: ${SMTP_USERNAME:?Set SMTP_USERNAME}
      GF_SMTP_PASSWORD__FILE: /run/secrets/smtp_password
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM_EMAIL:?Set SMTP_FROM_EMAIL}
      GF_SMTP_FROM_NAME: Papyrus monitoring
      GF_SMTP_STARTTLS_POLICY: ${SMTP_STARTTLS_POLICY:-MandatoryStartTLS}
      ALERT_EMAIL: ${ALERT_EMAIL:?Set ALERT_EMAIL}
    secrets: [grafana_admin_password, grafana_secret_key, smtp_password]
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      monitoring:
      edge:
        aliases: [papyrus-grafana]
  prometheus:
    <<: *service
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=3GB
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    networks: [monitoring]
  loki:
    <<: *service
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    mem_limit: 512m
    command: [-config.file=/etc/loki/config.yml]
    volumes:
      - ./loki.yml:/etc/loki/config.yml:ro
      - loki:/loki
    networks: [monitoring]
  alloy:
    <<: *service
    image: grafana/alloy:v1.21.0@sha256:9726bfba078de9bc2212c60c6e643238c700b4fe0868ea78cbe03163d03d95bf
    mem_limit: 512m
    privileged: true
    pid: host
    cgroup: host
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - --disable-reporting
      - /etc/alloy/config.alloy
    secrets: [postgres_dsn, powersync_storage_dsn]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./blackbox.yml:/etc/alloy/blackbox.yml:ro
      - ./postgres-queries.yml:/etc/alloy/postgres-queries.yml:ro
      - alloy:/var/lib/alloy
      - /:/rootfs:ro,rslave
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /var/lib/papyrus-observability/textfile:/textfile:ro
    networks: [monitoring, edge, application]

networks:
  monitoring:
  edge:
    external: true
    name: papyrus-edge
  application:
    external: true
    name: papyrus-production_default

volumes:
  grafana:
    name: papyrus-observability-grafana
  prometheus:
    name: papyrus-observability-prometheus
  loki:
    name: papyrus-observability-loki
  alloy:
    name: papyrus-observability-alloy

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  grafana_secret_key:
    file: ./secrets/grafana_secret_key
  smtp_password:
    file: ./secrets/smtp_password
  postgres_dsn:
    file: ./secrets/postgres_dsn
  powersync_storage_dsn:
    file: ./secrets/powersync_storage_dsn
