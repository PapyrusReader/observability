        {
          "uid": "papyrus-probe-failed",
          "title": "Public service probe failed",
          "condition": "C",
          "for": "3m",
          "noDataState": "Alerting",
          "execErrState": "Alerting",
          "annotations": {
            "summary": "Public service probe failed",
            "description": "Inspect the Papyrus dashboards and the observability recovery runbook."
          },
          "labels": {
            "severity": "critical"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "min(probe_success) < bool 1",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last"
                    },
                    "type": "query",
                    "query": {
                      "params": [
                        "C"
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
