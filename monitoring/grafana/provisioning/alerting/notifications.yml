apiVersion: 1
contactPoints:
  - orgId: 1
    name: Papyrus email
    receivers:
      - uid: papyrus-email
        type: email
        disableResolveMessage: false
        settings:
          addresses: $ALERT_EMAIL
          singleEmail: true
policies:
  - orgId: 1
    receiver: Papyrus email
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
