modules:
  http_2xx:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200]
      follow_redirects: true
  api_health:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp: ['"status"\s*:\s*"healthy"']
  sync_ready:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp: ['"ready"\s*:\s*true', '"started"\s*:\s*true']
